# Machine-readable crate registry for the tlm-jxcl-forge 100-crate
# workspace expansion. This is the frozen contract every crate is
# generated and implemented from -- see docs/CRATE_ARCHITECTURE.md for
# the narrative version and docs/DEPENDENCY_GRAPH.md for the DAG this
# file's `dependencies` fields must be acyclic under.
#
# Fields:
#   name                  - crate/package name (must match workspace member path)
#   category              - one of the 12 workstream categories
#   purpose               - one sentence: what this crate is for
#   owns                  - the invariant/data type/API this crate is the single source of truth for
#   public_api            - representative public items (not exhaustive)
#   dependencies          - other workspace crates this depends on (path deps)
#   external_dependencies - crates.io dependencies (empty = std only)
#   tests                 - test kinds this crate carries
#   source                - "extraction" (real code moved from an existing crate),
#                           "new" (genuinely new functionality built for this expansion),
#                           or "facade" (existing crate kept for API compatibility,
#                           re-exporting the crates it was split into)
#   status                - "planned" | "scaffolded" | "implemented"

# ============================== FOUNDATION (8) ==============================

[[crate]]
name = "jxcl-types"
category = "foundation"
purpose = "Shared newtype wrappers for architectural primitive values (word, address, register index, immediate) so every ISA/execution crate agrees on one representation."
owns = "The Word/Address/RegisterIndex/Immediate newtypes and their arithmetic/conversion impls."
public_api = ["Word", "Address", "RegisterIndex", "Immediate"]
dependencies = []
external_dependencies = []
tests = ["unit"]
source = "new"
status = "planned"

