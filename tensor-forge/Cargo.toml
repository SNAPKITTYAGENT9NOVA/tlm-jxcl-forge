[workspace]
resolver = "2"
members = [
    "crates/tensor-core",
    "crates/tensor-linalg",
    "crates/tensor-forge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Commercial"
repository = "https://github.com/SNAPKITTYAGENT9NOVA/tlm-jxcl-forge"

[workspace.dependencies]
tensor-core = { path = "crates/tensor-core", version = "0.1.0" }
tensor-linalg = { path = "crates/tensor-linalg", version = "0.1.0" }

ndarray = "0.17"
num-traits = "0.2"
thiserror = "2"
rand = "0.9"
rand_distr = "0.5"
approx = "0.5"
rayon = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
