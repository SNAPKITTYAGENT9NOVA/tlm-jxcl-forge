[package]
name = "tensor-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arbitrary-rank tensor type built on ndarray: creation, indexing/slicing with negative indices and steps, broadcasting, elementwise ops, reductions, memory layout control, and einops-style rearrange/reduce/repeat."

[dependencies]
ndarray = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
ndarray-rand = { version = "0.16", optional = true }
rand = { workspace = true, optional = true }
rand_distr = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }

[features]
default = []
rand = ["dep:rand", "dep:rand_distr", "dep:ndarray-rand"]
parallel = ["dep:rayon", "ndarray/rayon"]
serde = ["dep:serde", "ndarray/serde"]
