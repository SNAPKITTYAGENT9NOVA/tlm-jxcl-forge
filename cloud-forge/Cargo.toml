[workspace]
resolver = "2"
members = [
    "crates/cloud-types",
    "crates/cloud-errors",
    "crates/cloud-tags",
    "crates/cloud-lifecycle",
    "crates/cloud-resource",
    "crates/cloud-region",
    "crates/cloud-account",
    "crates/cloud-identity",
    "crates/cloud-policy",
    "crates/cloud-events",
    "crates/cloud-quota",
    "crates/cloud-core",
    "crates/cloud-scheduler",
    "crates/cloud-service-registry",
    "crates/cloud-reconciler",
    "crates/cloud-provisioner",
    "crates/cloud-control-plane",
    "crates/cloud-resource-registry",
    "crates/cloud-capacity",
    "crates/cloud-image",
    "crates/cloud-runtime",
]

[profile.release]
opt-level = 3
