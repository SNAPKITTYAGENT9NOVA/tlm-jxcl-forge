[package]
name = "cloud-identity"
version = "0.1.0"
edition = "2021"
description = "A minimal Principal type (User/Role/Service) -- enough for cloud-policy to evaluate access against. The full IAM surface (credentials, sessions, federation) is a later phase, not pulled forward here."
license = "AGPL-3.0-only OR LicenseRef-Commercial"

[dependencies]
cloud-errors = { path = "../cloud-errors" }
cloud-types = { path = "../cloud-types" }
