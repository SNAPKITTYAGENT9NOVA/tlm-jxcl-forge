[package]
name = "cloud-messaging"
version = "0.1.0"
edition = "2021"
description = "MessagingService: the fourth and last of the originally-planned composed services, creating queues and topics and fanning a topic's published messages out to its subscriber queues by composing cloud-delivery, cloud-visibility, and cloud-fanout with the Phase 1/2/3 resource model -- no new primitive, only composition."
license = "AGPL-3.0-only OR LicenseRef-Commercial"

[dependencies]
cloud-account = { path = "../cloud-account" }
cloud-delivery = { path = "../cloud-delivery" }
cloud-errors = { path = "../cloud-errors" }
cloud-events = { path = "../cloud-events" }
cloud-fanout = { path = "../cloud-fanout" }
cloud-identity = { path = "../cloud-identity" }
cloud-lifecycle = { path = "../cloud-lifecycle" }
cloud-policy = { path = "../cloud-policy" }
cloud-quota = { path = "../cloud-quota" }
cloud-reconciler = { path = "../cloud-reconciler" }
cloud-region = { path = "../cloud-region" }
cloud-resource = { path = "../cloud-resource" }
cloud-resource-registry = { path = "../cloud-resource-registry" }
cloud-types = { path = "../cloud-types" }
cloud-visibility = { path = "../cloud-visibility" }
