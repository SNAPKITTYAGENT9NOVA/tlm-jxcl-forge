[package]
name = "cloud-policy"
version = "0.1.0"
edition = "2021"
description = "An IAM-style Allow/Deny policy evaluation engine: principal + action + resource -> a decision, with the invariant that an explicit deny always dominates any number of matching allows."
license = "MIT"

[dependencies]
cloud-errors = { path = "../cloud-errors" }
cloud-identity = { path = "../cloud-identity" }
cloud-types = { path = "../cloud-types" }
