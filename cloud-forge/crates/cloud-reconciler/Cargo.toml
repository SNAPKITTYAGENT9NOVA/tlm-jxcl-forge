[package]
name = "cloud-reconciler"
version = "0.1.0"
edition = "2021"
description = "Computes the shortest valid sequence of cloud-lifecycle transitions from a current Lifecycle to a desired one, via BFS over the transition graph, or reports the desired state as unreachable."
license = "AGPL-3.0-only OR LicenseRef-Commercial"

[dependencies]
cloud-errors = { path = "../cloud-errors" }
cloud-lifecycle = { path = "../cloud-lifecycle" }
