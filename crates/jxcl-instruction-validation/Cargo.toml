[package]
name = "jxcl-instruction-validation"
version = "0.1.0"
edition = "2021"
description = "Per-instruction operand-legality checks (register range, immediate range, addressing-mode compatibility with the opcode) shared by the decoder and the static binary validator."
license = "MIT"

[dependencies]
jxcl-instructions = { path = "../jxcl-instructions" }
jxcl-operands = { path = "../jxcl-operands" }
jxcl-registers = { path = "../jxcl-registers" }
jxcl-errors = { path = "../jxcl-errors" }
