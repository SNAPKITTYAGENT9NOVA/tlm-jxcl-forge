[package]
name = "jxcl-isa-schema"
version = "0.1.0"
edition = "2021"
description = "A serde-serializable schema of the ISA generated from jxcl-opcodes/jxcl-constants/jxcl-registers/jxcl-flags, plus a mechanical cross-check against the numbers documented in docs/ISA_SPEC.md."
license = "MIT"

[dependencies]
jxcl-opcodes = { path = "../jxcl-opcodes" }
jxcl-constants = { path = "../jxcl-constants" }
jxcl-registers = { path = "../jxcl-registers" }
jxcl-flags = { path = "../jxcl-flags" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
