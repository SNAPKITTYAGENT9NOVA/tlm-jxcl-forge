[package]
name = "jxcl-rpc"
version = "0.1.0"
edition = "2021"
description = "A minimal RPC server/client implementing jxcl-protocol over line-delimited JSON on TCP."
license = "AGPL-3.0-only OR LicenseRef-Commercial"

[dependencies]
jxcl-protocol = { path = "../jxcl-protocol" }
jxcl-network = { path = "../jxcl-network" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time"] }
