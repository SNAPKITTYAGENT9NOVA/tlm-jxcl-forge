[package]
name = "jxcl-simulator"
version = "0.1.0"
edition = "2021"
description = "An embeddable top-level simulation API (load + run in one call) for using jxcl as a library from other Rust programs/services."
license = "AGPL-3.0-only OR LicenseRef-Commercial"

[dependencies]
jxcl-loader = { path = "../jxcl-loader" }
jxcl-machine = { path = "../jxcl-machine" }
jxcl-execution = { path = "../jxcl-execution" }
jxcl-memory-map = { path = "../jxcl-memory-map" }
