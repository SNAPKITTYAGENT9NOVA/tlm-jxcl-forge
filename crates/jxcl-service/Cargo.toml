[package]
name = "jxcl-service"
version = "0.1.0"
edition = "2021"
description = "Generic service scaffolding (graceful shutdown, health-check endpoint pattern, startup logging) extracted from photo-cache-service's two binaries' shared boilerplate."
license = "AGPL-3.0-only OR LicenseRef-Commercial"

[dependencies]
jxcl-http = { path = "../jxcl-http" }
jxcl-logging = { path = "../jxcl-logging" }
jxcl-config = { path = "../jxcl-config" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
