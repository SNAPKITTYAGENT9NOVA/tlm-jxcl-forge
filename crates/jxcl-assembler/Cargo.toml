[package]
name = "jxcl-assembler"
version = "0.1.0"
edition = "2021"
description = "The two-pass assembler: source text to an object file (plus a convenience path assembling and linking a single file straight to a binary, preserving the original single-step CLI workflow)."
license = "AGPL-3.0-only OR LicenseRef-Commercial"

[dependencies]
jxcl-binary = { path = "../jxcl-binary" }
jxcl-debug-info = { path = "../jxcl-debug-info" }
jxcl-encoding = { path = "../jxcl-encoding" }
jxcl-errors = { path = "../jxcl-errors" }
jxcl-instructions = { path = "../jxcl-instructions" }
jxcl-lexer = { path = "../jxcl-lexer" }
jxcl-linker = { path = "../jxcl-linker" }
jxcl-object = { path = "../jxcl-object" }
jxcl-opcodes = { path = "../jxcl-opcodes" }
jxcl-parser = { path = "../jxcl-parser" }
jxcl-registers = { path = "../jxcl-registers" }
jxcl-relocations = { path = "../jxcl-relocations" }
jxcl-symbols = { path = "../jxcl-symbols" }
