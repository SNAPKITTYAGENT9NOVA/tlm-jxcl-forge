[package]
name = "jxcl-decoding"
version = "0.1.0"
edition = "2021"
description = "Decodes an Instruction from its binary wire format -- the exact inverse of jxcl-encoding."
license = "MIT"

[dependencies]
jxcl-instructions = { path = "../jxcl-instructions" }
jxcl-bitops = { path = "../jxcl-bitops" }
jxcl-endian = { path = "../jxcl-endian" }
jxcl-bytes = { path = "../jxcl-bytes" }
jxcl-errors = { path = "../jxcl-errors" }
jxcl-types = { path = "../jxcl-types" }

[dev-dependencies]
jxcl-encoding = { path = "../jxcl-encoding" }
