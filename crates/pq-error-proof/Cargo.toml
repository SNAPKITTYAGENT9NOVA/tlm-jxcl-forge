[package]
name = "pq-error-proof"
version = "0.1.0"
edition = "2021"
description = "Zero-knowledge proofs (Groth16 over BLS12-381/Jubjub, via arkworks) that an error attestation commitment was honestly derived from a public error context, without revealing the attestation's secret opening randomness"
license = "MIT"

[dependencies]
pq-proof-types = { path = "../pq-proof-types" }
ark-bls12-381 = "0.6.0"
ark-ec = "0.6.0"
ark-ed-on-bls12-381 = { version = "0.6.0", features = ["r1cs"] }
ark-ff = "0.6.0"
ark-groth16 = "0.6.0"
ark-r1cs-std = "0.6.0"
ark-relations = "0.6.0"
ark-serialize = "0.6.0"
ark-snark = "0.6.0"
ark-std = "0.6.0"
sha2 = "0.11"

[dev-dependencies]
