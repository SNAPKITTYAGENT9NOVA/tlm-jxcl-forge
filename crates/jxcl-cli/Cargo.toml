[package]
name = "jxcl-cli"
version = "0.1.0"
edition = "2021"
description = "The `jxcl` command-line interface: asm/disasm/run/inspect/validate subcommands."
license = "AGPL-3.0-only OR LicenseRef-Commercial"

[[bin]]
name = "jxcl"
path = "src/main.rs"

[dependencies]
jxcl-assembler = { path = "../jxcl-assembler" }
jxcl-binary = { path = "../jxcl-binary" }
jxcl-constants = { path = "../jxcl-constants" }
jxcl-decoding = { path = "../jxcl-decoding" }
jxcl-disassembler = { path = "../jxcl-disassembler" }
jxcl-loader = { path = "../jxcl-loader" }
jxcl-simulator = { path = "../jxcl-simulator" }
jxcl-debugger = { path = "../jxcl-debugger" }
jxcl-isa-metadata = { path = "../jxcl-isa-metadata" }
jxcl-instruction-validation = { path = "../jxcl-instruction-validation" }
jxcl-config = { path = "../jxcl-config" }
jxcl-logging = { path = "../jxcl-logging" }

[dev-dependencies]
tempfile = "3"
