[package]
name = "jxcl-tensor"
version = "0.1.0"
edition = "2021"
authors = ["SNAPKITTY COLLECTIVE"]
license = "AGPL-3.0-only OR LicenseRef-Commercial"
repository = "https://github.com/snapkittyagent9nova/tlm-jxcl-forge"
description = "High-performance tensor library for JXCL, built on ndarray"

[dependencies]
ndarray = { version = "0.15", features = ["serde"] }
ndarray-rand = "0.14"
ndarray-stats = "0.5"
rand = "0.8"
rand_distr = "0.4"
thiserror = "1.0"
num-traits = "0.2"
num-complex = "0.4"
approx = "0.5"
rayon = { version = "1.7", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[features]
default = ["std"]
std = []
parallel = ["rayon"]
blas = []

[lib]
name = "jxcl_tensor"
path = "src/lib.rs"
