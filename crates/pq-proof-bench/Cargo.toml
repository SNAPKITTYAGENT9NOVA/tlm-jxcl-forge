[package]
name = "pq-proof-bench"
version = "0.1.0"
edition = "2021"
description = "Criterion benchmarks measuring attest()/verify() throughput for registered proof schemes."
license = "MIT"

[dependencies]
pq-proof-registry = { path = "../pq-proof-registry" }
pq-proof-verifier = { path = "../pq-proof-verifier" }
pq-proof-types = { path = "../pq-proof-types" }
pq-error-proof = { path = "../pq-error-proof" }
ark-std = "0.6.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "attest_verify"
harness = false
